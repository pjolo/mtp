# Package name
# https://confluence.hl7.org/display/FHIR/NPM+Package+Specification#NPMPackageSpecification-Packagename
id: ch.fhir.ig.ch-mtp
canonical: http://fhir.ch/ig/ch-mtp
name: CH_MTP
title: "CH MTP – Swiss Maternity Transfer Pass"
description: HL7 FHIR Implementation Guide for the Swiss Maternity Transfer Pass (CH-MTP).
  This guide defines profiles, extensions and value sets for the documentation
  of pregnancy, prenatal care and maternity data in Switzerland.
status: draft
license: CC0-1.0
copyright: CC0-1.0
jurisdiction: urn:iso:std:iso:3166#CHE
date: 2025-06-05
version: 0.1.0 # 1.2.2 published in May 2025
fhirVersion: 4.0.1
copyrightYear: 2024+
releaseLabel: ci-build # ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use
publisher:
  name: HL7 Switzerland
contact:
  - name: HL7 Switzerland
    telecom:
      - system: url
        value: https://www.hl7.ch/

dependencies:
  hl7.terminology.r4: 
    uri: http://terminology.hl7.org/ImplementationGuide/hl7.terminology
    version: 7.0.1
  ch.fhir.ig.ch-core: 6.0.0
  ch.fhir.ig.ch-term: 
    uri: http://fhir.ch/ig/ch-term/ImplementationGuide/ch.fhir.ig.ch-term
    version: 3.3.0
  ch.fhir.ig.ch-ips: 2.0.0
  hl7.fhir.uv.extensions.r4:  
    uri: http://hl7.org/fhir/extensions/ImplementationGuide/hl7.fhir.uv.extensions
    version: 5.2.0 
  hl7.fhir.uv.ips: 2.0.0 
# Extensions for converting between versions: https://build.fhir.org/versions.html#extensions
# FHIR Cross-Version Mapping Pack: https://build.fhir.org/ig/HL7/fhir-cross-version/
